# =============================================================================
# CORE SETTINGS
# =============================================================================

# Remap prefix from 'C-b' to 'C-x'
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Enable mouse control
set -g mouse on

# Increase history limit
set -g history-limit 102400

# =============================================================================
# WINDOW/PANE BEHAVIOR
# =============================================================================

# Start numbering from 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is deleted
set -g renumber-windows on

# =============================================================================
# VISUAL/UI SETTINGS
# =============================================================================

# Disable bell notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Clock color
setw -g clock-mode-colour yellow

# =============================================================================
# KEY BINDINGS - SYSTEM
# =============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# =============================================================================
# KEY BINDINGS - WINDOW MANAGEMENT
# =============================================================================

# New window with current path
bind n new-window -c '#{pane_current_path}'

# Break pane into new window
bind N break-pane -d

# =============================================================================
# KEY BINDINGS - PANE MANAGEMENT
# =============================================================================

# Split panes with current path
bind s split-window -h -c '#{pane_current_path}'  # vertical split
bind S split-window -v -c '#{pane_current_path}'  # horizontal split

# Pane resizing (without prefix)
bind-key -n C-S-h resize-pane -L
bind-key -n C-S-j resize-pane -D
bind-key -n C-S-k resize-pane -U
bind-key -n C-S-l resize-pane -R

# =============================================================================
# VIM INTEGRATION - PANE NAVIGATION
# =============================================================================

# Smart pane switching with vim awareness
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Normal mode navigation
bind-key -n M-C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n M-C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n M-C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n M-C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Copy mode navigation
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# =============================================================================
# PLUGINS
# =============================================================================

run ~/.config/tmux/plugins/tmux-dotbar/dotbar.tmux
